name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.0.1
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      version_tag:
        description: 'Version label for this build (e.g. v1.0.1)'
        required: false
        default: 'manual-build'

jobs:
  build:
    name: Build Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore"
          fi

      - name: Prepare Secrets & Environment
        run: |
          # Create placeholder .env if not present
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK for Versioning
        id: rename_apk
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          GIT_HASH=$(git rev-parse --short HEAD)
          TAG_OR_REF="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          elif [[ "$TAG_OR_REF" == v* ]]; then
            VERSION="$TAG_OR_REF"
          else
            VERSION="${TAG_OR_REF}-${GIT_HASH}"
          fi
          
          OUTPUT_NAME="Shapoorji-Delivery-${VERSION}-${BUILD_DATE}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUTPUT_NAME"
          echo "apk_path=$OUTPUT_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated: $OUTPUT_NAME"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.rename_apk.outputs.version }}-apk
          path: ${{ steps.rename_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename_apk.outputs.apk_path }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
